<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>Testing OpenAI API from browser...</h1>
<pre id="log"></pre>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent += msg + '\n'; }

async function test() {
  const key = atob('c2stcHJvai1laHZqaVNCYXVlYUpxSTZzU3FPVjZkMk02Mk1RNEFZMXZCcDBoZjNiVU1URWpiUmJKeWVCX3JfVm5yOUlfTnhNYjFnc3BnRDdqSVQzQmxia0ZKcUFZRjdXVkprNE5QX01odGJZbktfUnkxemJQME84Njl2dWdqQ09sUEU2T2MxN2hhU0ZJTWIxS1lmemNMbjgtbDhzZHpvSlYzZ0E=');
  addLog('Key decoded: ' + key.substring(0, 10) + '...');
  addLog('Key length: ' + key.length);
  
  try {
    addLog('\nFetching chat API...');
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{role: 'user', content: 'say meow'}],
        max_tokens: 10
      })
    });
    addLog('Status: ' + resp.status);
    const data = await resp.json();
    addLog('Response: ' + JSON.stringify(data).substring(0, 200));
  } catch (e) {
    addLog('ERROR: ' + e.message);
    addLog('Error type: ' + e.name);
    addLog('Full error: ' + JSON.stringify(e, Object.getOwnPropertyNames(e)));
  }
}

test();
</script>
</body>
</html>
